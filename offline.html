<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Jarvis</title>
<style>
  :root { color-scheme: dark; --paper: #0a0a0f; --ink: #ededf2; --muted: #9495a4; --rule: #2a2a35; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  main { display: flex; flex-direction: column; justify-content: center; gap: 16px; min-height: 100%; box-sizing: border-box; padding: 32px 28px; max-width: 420px; margin: 0 auto; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; }
  p { margin: 0; color: var(--muted); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button { padding: 10px 18px; border: 1px solid var(--rule); border-radius: 999px; background: none; color: var(--ink); font: inherit; font-weight: 600; }
  button.main { border-color: var(--ink); background: var(--ink); color: var(--paper); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Can’t reach Jarvis on your PC</h1>
  <p>Make sure the PC is on with Jarvis running, and that Tailscale is connected on this Mac. This page tries again every few seconds.</p>
  <p id="where"></p>
  <div class="actions">
    <button type="button" class="main" id="retry">Try again now</button>
    <button type="button" id="change">Change the address</button>
  </div>
</main>
<script>
  const address = new URLSearchParams(location.search).get('address')
  if (address) document.getElementById('where').textContent = `Looking for ${address}`
  document.getElementById('retry').addEventListener('click', () => window.jarvisMac.retry())
  document.getElementById('change').addEventListener('click', () => window.jarvisMac.changeAddress())
</script>
</body>
</html>
