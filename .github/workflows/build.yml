# Builds Jarvis for the Mac on GitHub's Macs, signs it with Jarvis's own certificate, and publishes
# it as a release the app updates itself from. A version tag (v1.3.0) builds and publishes; "Run
# workflow" builds only (the files are kept with the run, under Artifacts).
#
# Secrets: MAC_CERT_P12 (base64), MAC_CERT_PASSWORD and MAC_CERT_SHA1 for signing the app (one
# certificate for every version, so macOS keeps its microphone and keychain permissions), and
# UPDATE_SIGNING_KEY (Ed25519) for signing latest.json, which the app checks before installing.
name: Build the Mac app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the app (Apple silicon and Intel)
        run: npx electron-builder --mac dir --universal --publish never -c.mac.identity=null

      - name: Sign it with Jarvis's own certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_CERT_SHA1: ${{ secrets.MAC_CERT_SHA1 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/jarvis.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          APP="dist/mac-universal/Jarvis.app"
          codesign --force --deep --timestamp=none --keychain "$KEYCHAIN" --sign "$MAC_CERT_SHA1" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --requirements - "$APP"

      - name: Package the .dmg, the update zip and latest.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          APP="dist/mac-universal/Jarvis.app"
          ditto -c -k --keepParent "$APP" "dist/Jarvis-mac-$VERSION.zip"
          mkdir -p dist/dmg
          ditto "$APP" dist/dmg/Jarvis.app
          ln -s /Applications dist/dmg/Applications
          for attempt in 1 2 3; do
            hdiutil create -volname "Jarvis" -srcfolder dist/dmg -ov -format UDZO "dist/Jarvis-$VERSION.dmg" && break
            sleep 5
          done
          node sign-update.mjs "$VERSION" "dist/Jarvis-mac-$VERSION.zip" > dist/latest.json
          cat dist/latest.json

      - name: Keep the files with this run
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest.json

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/latest.json \
            --title "Jarvis for Mac ${GITHUB_REF_NAME#v}" \
            --notes "Installed copies (1.3.0 and later) update themselves. New install: open the .dmg and drag Jarvis into Applications; the first time, macOS says it can't check the app: open System Settings, Privacy & Security, and click Open Anyway next to Jarvis."

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/jarvis.keychain-db" 2>/dev/null || true
